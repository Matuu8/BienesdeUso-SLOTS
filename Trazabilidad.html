<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trazabilidad | Sistema de la Informacion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

  /* ============================================================
     TOKENS (tema oscuro del Power BI + azul Grupo SLOTS)
     ============================================================ */
  :root {
    --bg-0: #060F1F;
    --bg-1: #0A1A33;
    --ink: #F5F5F5;
    --ink-soft: #A9B6CC;
    --line: rgba(255,255,255,.10);
    --panel: rgba(255,255,255,.05);

    --accent: #4DA6FF;          /* Resumen */
    --c-ent: #4DA6FF;           /* Entradas */
    --c-sal: #FF8A5C;           /* Salidas  */
    --c-mov: #C77DFF;           /* Movimientos */
    --c-net: #5BD667;           /* Stock Neto */
    --c-warn: #E6C84F;          /* Alerta */

    --font: "Manrope", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    --chart-h: 528px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg-0);
    overflow-x: hidden;
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Fondo ---------- */
  .aurora {
    position: fixed; inset: 0; z-index: -3;
    background:
      radial-gradient(60vw 50vh at 12% 0%, rgba(10,60,143,.75), transparent 70%),
      radial-gradient(45vw 45vh at 95% 10%, rgba(77,166,255,.20), transparent 70%),
      radial-gradient(50vw 55vh at 60% 110%, rgba(199,125,255,.14), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    animation: drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift { from { filter: hue-rotate(0); transform: scale(1);} to { filter: hue-rotate(16deg); transform: scale(1.05);} }
  .grid-bg {
    position: fixed; inset: 0; z-index: -2; opacity: .45;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 20%, #000 5%, transparent 70%);
            mask-image: radial-gradient(ellipse at 50% 20%, #000 5%, transparent 70%);
  }

  .wrap { width: min(1480px, 94vw); margin: 0 auto; padding: 22px 0 28px; display: flex; flex-direction: column; gap: 18px; }

  /* ============================================================
     CABECERA
     ============================================================ */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .top-left, .top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px 10px 12px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-weight: 700; font-size: .92rem; text-decoration: none; color: var(--ink);
    transition: transform .25s var(--ease), border-color .25s, background .25s, box-shadow .3s, opacity .25s;
  }
  .btn .ico {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.10); transition: transform .35s var(--ease), background .25s, color .25s;
  }
  .btn svg { width: 17px; height: 17px; }
  .btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.3); }
  .btn:active { transform: translateY(0) scale(.98); }

  .btn.back:hover .ico { transform: translateX(-4px); }
  .btn.back:hover .ico, .btn.next .ico { background: var(--accent); color: #07101F; }

  .btn.next { padding: 10px 12px 10px 18px; border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 10px 30px -14px var(--accent); }
  .btn.next:hover .ico { transform: translateX(4px); }
  .btn.next:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: 0 14px 34px -12px var(--accent); }

  .btn.clear .badge {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px;
    display: none; place-items: center; font-size: .75rem; font-weight: 800;
    background: var(--c-sal); color: #1b0d05;
  }
  .btn.clear.has .badge { display: grid; animation: pop .35s var(--ease); }
  .btn.clear:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.clear:not(:disabled):hover .ico { background: var(--c-sal); color: #1b0d05; transform: rotate(-90deg); }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }

  .title small { display: block; color: var(--ink-soft); font-size: .8rem; font-weight: 500; margin-bottom: 2px; }
  .title h1 {
    font-size: clamp(1.7rem, 3.4vw, 2.5rem); font-weight: 800; letter-spacing: -.02em; line-height: 1; position: relative; padding-bottom: 8px;
  }
  .title h1::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; border-radius: 4px; background: var(--accent); transform-origin: left; animation: draw .9s var(--ease) .5s backwards; }
  @keyframes draw { from { transform: scaleX(0); } }

  .logo { width: 128px; background: #fff; border: 2px solid #263b8c; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 12px 30px -10px rgba(10,60,143,.9); flex: none; }
  .logo svg { display: block; width: 100%; height: auto; }
  .logo img { display: block; width: 100%; height: auto; user-select: none; }

  /* ============================================================
     FILTROS (segmentaciones)
     ============================================================ */
  .filters { position: relative; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .dd { position: relative; }
  .dd-btn {
    width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: border-color .25s, background .25s, box-shadow .3s;
  }
  .dd-btn:hover { border-color: rgba(255,255,255,.3); }
  .dd.open .dd-btn { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .dd.active .dd-btn { border-color: color-mix(in srgb, var(--accent) 65%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .dd-txt { min-width: 0; }
  .dd-lbl { display: block; font-size: .75rem; color: var(--ink-soft); font-weight: 500; }
  .dd-val { display: block; font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-btn svg { width: 18px; height: 18px; flex: none; transition: transform .3s var(--ease); color: var(--ink-soft); }
  .dd.open .dd-btn svg { transform: rotate(180deg); color: var(--accent); }

  .dd-panel {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px);
    min-width: 260px;
    background: #0E2144; border: 1px solid rgba(255,255,255,.18); border-radius: 16px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8);
    padding: 10px;
    opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top; pointer-events: none; visibility: hidden;
    transition: opacity .2s, transform .25s var(--ease), visibility .25s;
  }
  .dd.open .dd-panel { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
  .dd:nth-child(n+3) .dd-panel { left: auto; right: 0; }

  .dd-search {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: .9rem; margin-bottom: 8px;
  }
  .dd-search::placeholder { color: var(--ink-soft); }
  .dd-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: .9rem;
    transition: background .15s;
  }
  .opt:hover { background: rgba(255,255,255,.08); }
  .opt input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 5px; border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; flex: none; cursor: pointer; transition: background .2s, border-color .2s; }
  .opt input:checked { background: var(--accent); border-color: var(--accent); }
  .opt input:checked::after { content: ""; width: 9px; height: 5px; border-left: 2.5px solid #07101F; border-bottom: 2.5px solid #07101F; transform: rotate(-45deg) translate(1px,-1px); }
  .opt.all { font-weight: 700; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; margin-bottom: 4px; }
  .opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 12px; color: var(--ink-soft); font-size: .88rem; text-align: center; }

  /* panel de fecha */
  .date-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .date-grid label { font-size: .75rem; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; }
  .date-grid input {
    padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06);
    color: var(--ink); font: inherit; font-size: .88rem; color-scheme: dark;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-btn {
    padding: 6px 12px; border-radius: 99px; font-size: .8rem; font-weight: 700; border: 1px solid var(--line); background: rgba(255,255,255,.06);
    transition: background .2s, border-color .2s, color .2s;
  }
  .chip-btn:hover { border-color: var(--accent); }
  .chip-btn.on { background: var(--accent); color: #07101F; border-color: var(--accent); }

  /* ---------- fila de filtros activos ---------- */
  .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 34px; font-size: .88rem; color: var(--ink-soft); }
  .status b { color: var(--ink); }
  .tag {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-radius: 99px;
    background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--ink); font-size: .82rem; font-weight: 500; max-width: 340px; animation: pop .3s var(--ease);
  }
  .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); flex: none; transition: background .2s, color .2s; }
  .tag button:hover { background: var(--c-sal); color: #1b0d05; }
  .tag button svg { width: 11px; height: 11px; }

  /* ============================================================
     KPI
     ============================================================ */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi {
    --k: var(--accent);
    position: relative; overflow: hidden; padding: 18px 20px 16px; border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .3s var(--ease), border-color .3s, box-shadow .4s;
    animation: rise .7s var(--ease) backwards; animation-delay: calc(.25s + var(--i) * .08s);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k); }
  .kpi::after { content: ""; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--k) 35%, transparent), transparent); opacity: .7; transition: transform .6s var(--ease); }
  .kpi:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--k) 60%, transparent); box-shadow: 0 24px 50px -24px var(--k); }
  .kpi:hover::after { transform: scale(1.5); }
  .kpi-label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; position: relative; z-index: 1; }
  .kpi-label i { width: 9px; height: 9px; border-radius: 50%; background: var(--k); box-shadow: 0 0 12px var(--k); }
  .kpi-val { position: relative; z-index: 1; margin-top: 8px; font-size: clamp(2rem, 3.6vw, 3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .kpi-cap { position: relative; z-index: 1; margin-top: 6px; font-size: .78rem; color: var(--ink-soft); min-height: 1.2em; }
  .kpi-cap em { font-style: normal; color: var(--k); font-weight: 700; }

  .kpi:nth-child(1) { --k: var(--c-mov); }
  .kpi:nth-child(2) { --k: var(--c-ent); }
  .kpi:nth-child(3) { --k: var(--c-sal); }
  .kpi:nth-child(4) { --k: var(--c-net); }

  /* ============================================================
     GRÁFICOS
     ============================================================ */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    position: relative; padding: 18px 20px 16px; border-radius: 22px; border: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: rise .7s var(--ease) backwards; animation-delay: calc(.55s + var(--i) * .1s);
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .card-head h2 { font-size: 1.15rem; font-weight: 800; }
  .card-head p { font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }
  .legend { display: flex; gap: 8px; }
  .lg {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; font-size: .8rem; font-weight: 700;
    border: 1px solid var(--line); background: rgba(255,255,255,.05); transition: opacity .25s, border-color .25s, background .25s;
  }
  .lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .lg:hover { border-color: var(--c); }
  .lg[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }

  .chart { position: relative; height: calc(var(--chart-h) + 26px); --label: 150px; --pad-r: 54px; }
  .grid-lines { position: absolute; left: var(--label); right: var(--pad-r); top: 0; height: var(--chart-h); pointer-events: none; }
  .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.08); transition: left .5s var(--ease); }
  .gl span { position: absolute; top: calc(100% + 6px); left: 0; transform: translateX(-50%); font-size: .7rem; color: var(--ink-soft); white-space: nowrap; }
  .gl:first-child { background: rgba(255,255,255,.22); }
  .rows { position: absolute; inset: 0 0 auto 0; height: var(--chart-h); }
  .row {
    position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; border-radius: 10px; cursor: pointer; text-align: left;
    transition: transform .6s var(--ease), opacity .4s, background .2s, box-shadow .2s;
  }
  .row:hover { background: rgba(255,255,255,.05); }
  .row.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .row.hide { opacity: 0; pointer-events: none; }
  .rows.has-sel .row:not(.sel) { opacity: .4; }
  .rows.has-sel .row:not(.sel):hover { opacity: .8; }
  .lbl { width: var(--label); padding: 0 12px 0 8px; font-size: .84rem; font-weight: 500; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bars { position: absolute; left: var(--label); right: var(--pad-r); top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .bar { height: min(15px, 32%); width: 0; border-radius: 0 6px 6px 0; background: var(--c); position: relative; transition: width .7s var(--ease), filter .2s; box-shadow: 0 0 16px -4px var(--c); }
  .bar.ent { --c: var(--c-ent); }
  .bar.sal { --c: var(--c-sal); }
  .bar.nz { min-width: 3px; }
  .bar b { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); font-size: .74rem; font-weight: 700; white-space: nowrap; }
  .row:hover .bar { filter: brightness(1.2); }

  .empty-chart { position: absolute; inset: 0 0 26px 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ink-soft); text-align: center; }
  .empty-chart.on { display: flex; }
  .empty-chart .btn { padding: 8px 16px; }

  .tip {
    position: fixed; z-index: 100; pointer-events: none; padding: 12px 14px; border-radius: 14px; min-width: 190px;
    background: #0E2144; border: 1px solid rgba(255,255,255,.2); box-shadow: 0 20px 40px -12px rgba(0,0,0,.8);
    font-size: .82rem; opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .2s var(--ease);
  }
  .tip.on { opacity: 1; transform: none; }
  .tip h4 { font-size: .9rem; margin-bottom: 8px; }
  .tip div { display: flex; justify-content: space-between; gap: 18px; padding: 2px 0; }
  .tip div span:first-child { color: var(--ink-soft); display: flex; align-items: center; gap: 7px; }
  .tip i { width: 8px; height: 8px; border-radius: 2px; }
  .tip hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  /* ============================================================
     ALERTA
     ============================================================ */
  .alert {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 18px;
    border: 1px solid color-mix(in srgb, var(--c-warn) 45%, transparent);
    background: linear-gradient(90deg, color-mix(in srgb, var(--c-warn) 14%, transparent), rgba(255,255,255,.03));
    animation: rise .7s var(--ease) 1s backwards;
  }
  .alert .ai { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c-warn) 22%, transparent); color: var(--c-warn); animation: beat 2.6s ease-in-out 1.6s 2; }
  .alert .ai svg { width: 22px; height: 22px; }
  @keyframes beat { 0%,100% { transform: scale(1);} 50% { transform: scale(1.14);} }
  .alert p { font-size: clamp(.9rem, 1.3vw, 1.05rem); line-height: 1.5; transition: opacity .25s; }
  .alert p strong { color: var(--c-warn); }
  .alert p.swap { opacity: 0; }

  /* ============================================================
     PIE
     ============================================================ */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; color: var(--ink-soft); font-size: .8rem; }
  .pager { display: flex; gap: 6px; flex-wrap: wrap; }
  .pager a {
    padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-soft); text-decoration: none; font-weight: 700; font-size: .8rem;
    transition: background .2s, color .2s, border-color .2s;
  }
  .pager a:hover { color: var(--ink); border-color: rgba(255,255,255,.35); }
  .pager a[aria-current="page"] { background: var(--accent); color: #07101F; border-color: var(--accent); }

  /* ---------- transición entre páginas ---------- */
  .curtain {
    position: fixed; inset: 0; z-index: 200; pointer-events: none; background: var(--curtain, #4DA6FF);
    clip-path: circle(0 at var(--cx, 50%) var(--cy, 50%)); transition: clip-path .7s var(--ease);
  }
  .curtain.on { clip-path: circle(150vmax at var(--cx, 50%) var(--cy, 50%)); }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 1100px) {
    .filters { grid-template-columns: repeat(2, 1fr); }
    .dd:nth-child(n) .dd-panel { left: 0; right: 0; }
    .dd:nth-child(2n) .dd-panel { left: auto; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .filters { grid-template-columns: 1fr; }
    .dd:nth-child(n) .dd-panel { left: 0; right: 0; }
    .logo { display: none; }
    .chart { --label: 110px; --pad-r: 44px; }
    .kpi-val { font-size: 1.9rem; }
    .btn span.t { display: none; }
    .btn, .btn.next { padding: 8px; }
    .btn.next .ico, .btn .ico { width: 32px; height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    .aurora { animation: none; }
  }


  /* ============================================================
     ESPECÍFICO DE "TRAZABILIDAD"
     ============================================================ */
  .wrap { width: min(1760px, 96vw); }
  :root {
    --accent: #C77DFF;
    --c-ok: #5BD667; --c-mid: #E6C84F; --c-bad: #FF8A5C; --c-crit: #FF6B76;
    --c-ubicacion: #4DB6AC; --c-calidad: #FF8A5C;
  }

  /* botones de navegación: ← Por Ubicacion  /  Calidad → */
  .btn.home { padding: 10px; }
  .btn.home:hover .ico { background: var(--accent); color: #07101F; transform: scale(1.08); }
  .btn.back:hover .ico { background: var(--c-ubicacion); color: #07101F; }
  .btn.next { border-color: color-mix(in srgb, var(--c-calidad) 55%, transparent); box-shadow: 0 10px 30px -14px var(--c-calidad); }
  .btn.next .ico { background: var(--c-calidad); color: #1b0d05; }
  .btn.next:hover { background: color-mix(in srgb, var(--c-calidad) 16%, transparent); box-shadow: 0 14px 34px -12px var(--c-calidad); }

  .opt span { min-width: 0; }
  .opt small { display: block; color: var(--ink-soft); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- zona superior ---------- */
  .panel-top { position: relative; z-index: 30; display: grid; grid-template-columns: 1fr; gap: 14px; align-items: stretch; }

  .gauge-card, .kpi-big {
    position: relative; overflow: hidden; border-radius: 22px; border: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .3s var(--ease), border-color .3s, box-shadow .4s;
    animation: rise .7s var(--ease) backwards;
  }
  .gauge-card { --gc: var(--c-mid); padding: 18px 22px 16px; animation-delay: .2s; display: flex; flex-direction: column; align-items: center; }
  .kpi-big { --k: var(--c-bad); padding: 20px 22px; display: flex; flex-direction: column; justify-content: center; animation-delay: .3s; }
  .kpi-big::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k); }
  .gauge-card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--gc) 60%, transparent); box-shadow: 0 24px 50px -24px var(--gc); }
  .kpi-big:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--k) 60%, transparent); box-shadow: 0 24px 50px -24px var(--k); }
  .kpi-big .kpi-label { font-size: .95rem; }
  .kpi-big .kpi-label i { background: var(--k); box-shadow: 0 0 12px var(--k); }
  .kpi-big .kpi-val { font-size: clamp(2.6rem, 4.4vw, 3.6rem); }
  .kpi-big .kpi-cap { line-height: 1.4; }

  .gauge-title { align-self: flex-start; font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
  .gauge-title i { width: 9px; height: 9px; border-radius: 50%; background: var(--gc); box-shadow: 0 0 12px var(--gc); transition: background .5s, box-shadow .5s; }
  .gauge { position: relative; width: 100%; max-width: 270px; margin-top: 4px; }
  .gauge svg { width: 100%; height: auto; display: block; overflow: visible; }
  .g-track, .g-fill { fill: none; stroke-width: 16; stroke-linecap: round; }
  .g-track { stroke: rgba(255,255,255,.10); }
  .g-fill { stroke: var(--gc); stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1s var(--ease), stroke .5s; filter: drop-shadow(0 0 7px var(--gc)); }
  .g-needle { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; transform-origin: 110px 110px; transform: rotate(-90deg); transition: transform 1s var(--ease); }
  .g-hub { fill: var(--ink); }
  .g-lbl { fill: var(--ink-soft); font-size: 10px; font-family: var(--font); }
  .gauge-val { margin-top: 8px; text-align: center; font-size: clamp(1.8rem, 3vw, 2.3rem); font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .gauge-cap { margin-top: 8px; font-size: .78rem; color: var(--ink-soft); text-align: center; }
  .gauge-cap em { font-style: normal; font-weight: 700; color: var(--gc); transition: color .5s; }

  /* filtros + barra de estado documental */
  .right-col { display: flex; flex-direction: column; gap: 14px; }
  .pf3 { position: relative; z-index: 6; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pf3 .dd .dd-panel { left: 0; right: auto; min-width: 280px; width: max-content; max-width: min(420px, 90vw); }
  .pf3 .dd.r .dd-panel { left: auto; right: 0; }

  .estados { position: relative; z-index: 1; flex: 1; padding: 16px 18px 14px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: rise .7s var(--ease) .4s backwards; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .estados h3 { font-size: .9rem; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .estados h3 small { font-weight: 500; color: var(--ink-soft); font-size: .76rem; }
  .ebar { display: flex; height: 18px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.07); gap: 3px; }
  .eseg { height: 100%; border-radius: 4px; background: var(--c); width: 0; transition: width .8s var(--ease), opacity .3s; cursor: pointer; min-width: 0; }
  .eseg:hover { filter: brightness(1.2); }
  .elegend { display: flex; flex-wrap: wrap; gap: 8px; }
  .echip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; font-size: .8rem; font-weight: 700; border: 1px solid var(--line); background: rgba(255,255,255,.05); transition: border-color .25s, background .25s, opacity .25s; }
  .echip i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .echip b { color: var(--ink); font-weight: 800; }
  .echip span { color: var(--ink-soft); font-weight: 500; }
  .echip:hover { border-color: var(--c); }
  .echip.on { background: color-mix(in srgb, var(--c) 18%, transparent); border-color: var(--c); }
  .estados.has-sel .eseg:not(.on) { opacity: .3; }
  .estados.has-sel .echip:not(.on) { opacity: .5; }

  /* ---------- tabla ---------- */
  .tcard { padding-bottom: 14px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-soft); pointer-events: none; }
  .search input { width: min(320px, 78vw); padding: 10px 14px 10px 36px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: .88rem; transition: border-color .25s, box-shadow .25s; }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .count { font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }
  .count b { color: var(--ink); }

  .tbl-wrap { overflow: auto; max-height: 580px; border-radius: 14px; border: 1px solid var(--line); background: rgba(6,15,31,.45); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1400px; table-layout: fixed; font-size: .82rem; }
  thead th { position: sticky; top: 0; z-index: 3; background: #0E2144; text-align: left; padding: 0; border-bottom: 1px solid rgba(255,255,255,.18); vertical-align: bottom; }
  thead button { width: 100%; display: flex; align-items: flex-end; gap: 5px; padding: 11px 9px; font-weight: 700; font-size: .76rem; line-height: 1.2; text-align: left; transition: background .2s; }
  thead th.nm button { justify-content: flex-end; text-align: right; }
  thead button span { white-space: normal; }
  thead button:hover { background: rgba(255,255,255,.07); }
  thead .arr { width: 12px; height: 12px; opacity: .25; flex: none; margin-bottom: 2px; transition: transform .3s var(--ease), opacity .2s, color .2s; }
  thead th[aria-sort] .arr { opacity: 1; color: var(--accent); }
  thead th[aria-sort="descending"] .arr { transform: rotate(180deg); }
  tbody td { padding: 9px 9px; border-top: 1px solid rgba(255,255,255,.06); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .15s; }
  /* Mostrar completo el Nro Serie Softland, sin ocultar dígitos con puntos suspensivos. */
  tbody td.td-photo { text-align: center; padding: 4px 6px; overflow: visible; }
  thead th.th-photo button { justify-content: center; text-align: center; }

  tbody td:nth-child(6) { white-space: normal; overflow-wrap: anywhere; text-overflow: clip; min-width: 92px; }
  tbody tr:nth-child(even) td { background: rgba(255,255,255,.022); }
  tbody tr:hover td { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  td.nm { text-align: right; font-weight: 800; }
  td.pos { color: var(--c-ok); } td.neg { color: var(--c-bad); } td.zero { color: var(--ink-soft); }
  td.dim { color: var(--ink-soft); }
  td.code { font-weight: 700; }
  tfoot td { position: sticky; bottom: 0; z-index: 3; background: #0E2144; padding: 12px 9px; font-weight: 800; border-top: 1px solid rgba(255,255,255,.18); white-space: nowrap; }
  tfoot td.nm { text-align: right; color: var(--accent); }
  .badge-t { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .74rem; font-weight: 700; border: 1px solid; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  .b-ing { color: #75B7FF; background: rgba(77,166,255,.14); border-color: rgba(77,166,255,.45); }
  .b-rec { color: #6EE0D0; background: rgba(77,182,172,.15); border-color: rgba(77,182,172,.5); }
  .b-ent { color: #FFB08F; background: rgba(255,138,92,.14); border-color: rgba(255,138,92,.5); }
  .b-oth { color: #E6C84F; background: rgba(230,200,79,.12); border-color: rgba(230,200,79,.45); }
  .e-comp { color: #7BE585; background: rgba(91,214,103,.13); border-color: rgba(91,214,103,.5); }
  .e-inc { color: #E6C84F; background: rgba(230,200,79,.12); border-color: rgba(230,200,79,.45); }
  .e-sin { color: #FF9C7A; background: rgba(255,138,92,.15); border-color: rgba(255,138,92,.55); }
  .no-rows { text-align: center !important; padding: 40px 14px !important; color: var(--ink-soft); white-space: normal !important; }
  .no-rows .btn { margin-top: 12px; padding: 8px 16px; }
  tbody.fresh tr { animation: rowIn .45s var(--ease) backwards; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }

  .alert.ok { border-color: color-mix(in srgb, var(--c-ok) 45%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--c-ok) 14%, transparent), rgba(255,255,255,.03)); }
  .alert.ok .ai { background: color-mix(in srgb, var(--c-ok) 22%, transparent); color: var(--c-ok); }
  .alert.ok p strong { color: var(--c-ok); }

  @media (max-width: 1280px) {
    .panel-top { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .panel-top { grid-template-columns: 1fr; }
    .pf3 { grid-template-columns: repeat(2, 1fr); }
    .pf3 .dd:nth-child(2n) .dd-panel { left: auto; right: 0; }
    .pf3 .dd:nth-child(2n+1) .dd-panel { left: 0; right: auto; }
  }
  @media (max-width: 620px) {
    .pf3 { grid-template-columns: 1fr; }
    .pf3 .dd .dd-panel, .pf3 .dd:nth-child(n) .dd-panel { left: 0; right: 0; min-width: 0; width: auto; max-width: none; }
    .search, .search input { width: 100%; }
  }

  /* Selector de columnas (añadido) */
  .card-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-tools .dd.cols-dd .dd-btn { width: auto; min-width: 170px; padding: 8px 14px; }
  .card-tools .dd.cols-dd .dd-panel { left: auto; right: 0; width: 270px; }
  /* El desplegable de columnas queda por encima del encabezado/pie fijos de la tabla */
  .card-tools .dd.cols-dd { z-index: 20; }
  .card-tools .dd.cols-dd .dd-panel { z-index: 20; }
  .cols-dd .opt.reset { color: var(--ink-soft); font-size: .82rem; justify-content: center; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; }
  .cols-dd .opt input:disabled { opacity: .45; cursor: not-allowed; }
  /* Botón de Foto en Tabla (Icono de cámara compacto) */
  .btn-photo {
    display: inline-grid; place-items: center;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--ink); transition: background .2s, border-color .2s, transform .15s, box-shadow .2s;
  }
  .btn-photo:hover { background: var(--accent); color: #07101F; transform: scale(1.12); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn-photo svg { width: 14px; height: 14px; flex: none; }

  /* ============================================================
     MODAL / VISOR DE FOTOS PANTALLA COMPLETA
     ============================================================ */
  .photo-modal-backdrop {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(3, 7, 16, 0.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease);
  }
  .photo-modal-backdrop.open { opacity: 1; pointer-events: auto; }
  
  .photo-modal-header {
    position: absolute; top: 16px; left: 20px; right: 20px;
    display: flex; align-items: center; justify-content: space-between; z-index: 10; pointer-events: none;
  }
  .photo-modal-header * { pointer-events: auto; }
  .photo-title { display: flex; flex-direction: column; gap: 2px; }
  .photo-title strong { font-size: 1.15rem; color: #fff; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .photo-title span { font-size: .84rem; color: var(--ink-soft); font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,.6); }

  .photo-toolbar { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 99px; padding: 4px 8px; backdrop-filter: blur(8px); }
  .photo-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: transparent; transition: background .2s, color .2s; color: var(--ink-soft); }
  .photo-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
  .photo-btn svg { width: 18px; height: 18px; }
.photo-stage {
    width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; position: relative; cursor: grab;
  }
  .photo-stage:active { cursor: grabbing; }

  .photo-img {
    max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.9);
    transition: transform .15s ease-out; transform-origin: center center; user-select: none;
  }
  
  .photo-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 11; width: 46px; height: 46px; border-radius: 50%; display: none; place-items: center; background: rgba(255,255,255,.10); border: 1px solid var(--line); color: #fff; backdrop-filter: blur(8px); transition: background .2s; }
  .photo-nav:hover { background: rgba(255,255,255,.25); }
  .photo-nav svg { width: 22px; height: 22px; }
  .photo-nav.prev { left: 22px; } .photo-nav.next { right: 22px; }
  .photo-counter { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 11; display: none; padding: 6px 14px; border-radius: 99px; background: rgba(255,255,255,.10); border: 1px solid var(--line); color: #fff; font-size: .85rem; font-weight: 700; backdrop-filter: blur(8px); }
  .photo-no-img {
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--ink-soft); text-align: center; padding: 20px;
  }
  .photo-no-img svg { width: 52px; height: 52px; opacity: .5; color: var(--c-warn); }
  .photo-no-img span { font-size: 1.15rem; font-weight: 700; color: var(--ink); }

</style>
</head>

<script>
(async function () {
  const API_GOOGLE_SHEETS = 'https://script.google.com/macros/s/AKfycbycr0DnThmvRInenbOO4pAheQKVKxQwoxGcjahUr0LfIoCNZK1QRi0tKE_9DV13IbSP/exec';
  const normKey = v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const clean = v => String(v ?? '').trim();
  const dateISO = v => {
    if (v instanceof Date) return v.toISOString().slice(0,10);
    const x=clean(v); if (!x) return '';
    let m=x.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=x.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);
    if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    const d=new Date(x); return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10);
  };
  const num = v => {
    if(typeof v==='number') return v;
    let x=clean(v).replace(/\s/g,'').replace(/[^\d,.-]/g,'');
    if(!x) return NaN;
    if(x.includes(',') && x.includes('.')) x=x.lastIndexOf(',')>x.lastIndexOf('.')?x.replace(/\./g,'').replace(',','.'):x.replace(/,/g,'');
    else if(x.includes(',')) x=x.replace(',','.');
    return Number(x);

  const emptyData = {version:'API',arts:[],ubs:[],custs:[],tipos:[],estados:[],notros:[],rows:[],slCust:[],minDate:'2000-01-01',maxDate:'2099-12-31'};

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);

/* ================================================================

const isSin = r => ESTADOS[r[5]] === SIN_DOC;

/* ---------- estado ---------- */
const state = { from: '', to: '', not: new Set(), cust: new Set(), q: '', sort: { k: 'des', d: 1 } };

function filtered({ skipNot = false } = {}) {

    (!state.from || r[0] >= state.from) && (!state.to || r[0] <= state.to) &&

function makeMulti({ el, label, set, getItems, display = x => x }) {
  el.innerHTML = `
    <button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">

    </div>`;

  let shown = [];

  function renderList() {
    const prevScroll = list.scrollTop;
    const active = document.activeElement && list.contains(document.activeElement) ? document.activeElement : null;
    const fk = active ? (active.dataset.k ?? (active.hasAttribute('data-all') ? 'all' : null)) : null;
    const q = norm(search.value.trim());
    shown = getItems().filter(it => !q || norm(display(it.label)).includes(q));

    if (!shown.length) html += '<div class="empty">Sin resultados</div>';
    list.innerHTML = html;
    list.scrollTop = prevScroll;
    if (fk !== null) { const n = fk === 'all' ? $('[data-all]', list) : $(`[data-k="${fk}"]`, list); if (n) n.focus({ preventScroll: true }); }
  }

    else val.textContent = set.size + ' seleccionados';

    const t = e.target;

  function commit() {
    state.from = iF.value; state.to = iT.value;
    if (state.from && state.to && state.from > state.to) [state.from, state.to] = [state.to, state.from];

/* ================================================================
   TABLA — mismas columnas y mismo orden que el Power BI:
   Fecha, Destip, Artcod, Despro, Notros, Establecimiento, Edificio,
   Piso, Ubicacion, Tipo de Movimiento, Custodio, Suma de CANTIDAD
   (un renglón por registro, sin agrupar; orden inicial: Despro A→Z)
   ================================================================ */
const COLS = [
  { k: 'foto',   t: 'Foto', w: 5.5 },
  { k: 'fecha',  t: 'Fecha', w: 7.2 },
  { k: 'destip', t: 'Destip', w: 10.5 },
  { k: 'art',    t: 'Artcod', w: 9.2 },
  { k: 'des',    t: 'Despro', w: 12.5 },
  { k: 'not',    t: 'Nro Serie Softland', w: 5.2 },
  { k: 'estab',  t: 'Establecimiento', w: 8.6 },
  { k: 'edif',   t: 'Edificio', w: 7.8 },
  { k: 'piso',   t: 'Piso', w: 7 },
  { k: 'ubi',    t: 'Ubicacion', w: 9.4 },
  { k: 'tipo',   t: 'Tipo de Movimiento', w: 7.6 },
  { k: 'cust',   t: 'Custodio', w: 8.8 },
  { k: 'sum',    t: 'Suma de CANTIDAD', nm: true, w: 6.2 },
  { k: 'tasig',  t: 'Tipo de Asignacion', w: 7.4 },
  { k: 'est',    t: 'Estado', w: 6.6 },
  { k: 'recep',  t: 'Recepcionista_ID', w: 9.4 },
  { k: 'ucarga', t: 'Usuario de Carga', w: 12.5 }
];
const hidden = new Set();
const visCols = () => COLS.filter(c => !hidden.has(c.k));
const raw = (g, k) => {
  switch (k) {
    case 'foto': return '';
    case 'fecha': return g.f;
    case 'destip': return ARTS[g.a][2]; case 'art': return ARTS[g.a][0]; case 'des': return ARTS[g.a][1];
    case 'not': return NOTROS[g.nt];
    case 'estab': return UBS[g.u][0]; case 'edif': return UBS[g.u][1]; case 'piso': return UBS[g.u][2]; case 'ubi': return UBS[g.u][3];
    case 'tipo': return TIPOS[g.t];
    case 'cust': return CUSTS[g.c];
    case 'sum': return g.sum;
    case 'tasig': return g.x[0]; case 'est': return g.x[1]; case 'recep': return g.x[2]; case 'ucarga': return g.x[3];
  }
};
const shownText = (g, k) => ['estab', 'edif', 'piso', 'ubi', 'cust', 'recep'].includes(k) ? titleCase(raw(g, k)) : k === 'fecha' ? fmtDate(g.f) : k === 'sum' ? (g.sum == null ? '' : nf.format(g.sum)) : String(raw(g, k) ?? '');
const badgeCls = t => t === 'Ingreso' ? 'b-ing' : t === 'Recepción' ? 'b-rec' : t === 'Entrega' ? 'b-ent' : 'b-oth';

function groupRows(rows) {
  // Sin agrupar ni sumar: un renglón por cada registro del origen, tal como viene.
  // Registros con el mismo NOTROS / CODFOR / NROFOR se muestran por separado con su cantidad original.
  return rows.map(r => ({ f: r[0], a: r[1], u: r[2], c: r[3], t: r[4], nt: r[6], x: [r[8], r[9], r[10], r[11]],
    sum: (r[7] != null && Number.isFinite(Number(r[7]))) ? Number(r[7]) : null }));
}

function buildTableHead() {

function applyCols() { buildTableHead(); renderColsMenu(); renderTable(lastRows); }
const closeCols = () => { $('#colsDd').classList.remove('open'); $('#colsBtn').setAttribute('aria-expanded', 'false'); };

let lastRows = [], firstPaint = true;
function renderTable(rows) {
  lastRows = rows;
  let groups = groupRows(rows);
  const q = norm(state.q.trim());
  if (q) groups = groups.filter(g => norm(visCols().map(c => shownText(g, c.k)).join(' ')).includes(q));

  const { k, d } = state.sort;
  groups.sort((x, y) => {
    let a = raw(x, k), b = raw(y, k), r;
    if (k === 'sum') { a = a ?? -Infinity; b = b ?? -Infinity; r = (a - b) * d; }
    else r = collator.compare(String(a ?? ''), String(b ?? '')) * d;
    return r || (x.f < y.f ? -1 : x.f > y.f ? 1 : 0);
  });
  document.querySelectorAll('#thead th').forEach(th => {
    if (th.dataset.k === k) th.setAttribute('aria-sort', d === 1 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort');
  });

  const tb = $('#tbody');
  if (!groups.length) {
    tb.innerHTML = `<tr><td class="no-rows" colspan="${visCols().length}">No hay movimientos con estos filtros.<br><button class="btn" type="button" data-clear><span class="t">Borrar filtros</span></button></td></tr>`;
    $('[data-clear]', tb).addEventListener('click', clearAll);
  } else {
    tb.innerHTML = groups.map(g => '<tr>' + visCols().map(c => {
      if (c.k === 'foto') {
        const notSerie = NOTROS[g.nt] || '';
        const artNom = ARTS[g.a][1] || '';
        return `<td class="td-photo"><button type="button" class="btn-photo" title="Ver foto" data-photo-code="${esc(notSerie)}" data-photo-name="${esc(artNom)}">${ICON_CAM}</button></td>`;
      }
      if (c.k === 'sum') { const s = g.sum; return `<td class="nm ${s == null ? '' : s > 0 ? 'pos' : s < 0 ? 'neg' : 'zero'}">${s == null ? '' : nf.format(s)}</td>`; }
      if (c.k === 'tipo') return `<td><span class="badge-t ${badgeCls(raw(g, 'tipo'))}">${esc(raw(g, 'tipo'))}</span></td>`;
      const txt = shownText(g, c.k);
      const cls = c.k === 'art' ? 'code' : !txt ? 'dim' : '';
      return `<td class="${cls}" title="${esc(txt)}">${txt ? esc(txt) : '—'}</td>`;
    }).join('') + '</tr>').join('');
  }
  if (firstPaint) { tb.classList.add('fresh'); firstPaint = false; setTimeout(() => tb.classList.remove('fresh'), 1400); }

  const totS = groups.reduce((a, g) => a + (g.sum || 0), 0);
  const lblK = (visCols().find(c => c.k !== 'sum') || {}).k;
  $('#tfoot').innerHTML = visCols().map(c => c.k === 'sum' ? `<td class="nm">${nf.format(totS)}</td>` : c.k === lblK ? '<td>Total</td>' : '<td></td>').join('');
  $('#count').innerHTML = `<b>${nf.format(groups.length)}</b> filas`;
}

let zoomLevel = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function updateTransform() {
  photoImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;
}

function resetZoom() {
  zoomLevel = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
}

/* ---- Fotos automáticas desde la carpeta del proyecto de VS Code ---- */
const photoPrev = $('#photoPrev'), photoNext = $('#photoNext'), photoCounter = $('#photoCounter');
let photoList = [], photoIdx = 0, photoRequestId = 0, photoCode = '';
const IMAGE_EXTS = ['jpg','jpeg','jfif','png','webp','gif','bmp','tif','tiff','avif','heic','heif'];

function revokePhotoURLs() {}
const fotoBase = n => String(n).split('?')[0].split('#')[0].split(/[\\/]/).pop().trim();
const fotoStem = n => fotoBase(n).replace(/\.[^.]+$/, '');
const fotoNorm = n => fotoStem(n).normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const cajaTag = n => {
  const s = String(n).normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
  const m = s.match(/caja[\s_-]*0*([12])(?=[^0-9]|$)/i);
  return m ? 'CAJA' + m[1] : '';
};
function probeImage(url) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(true);
    im.onerror = () => resolve(false);
    im.src = url;
  });
}
async function getProjectPhotoIndex() {
  // Se consulta en cada clic: las fotos nuevas copiadas a la carpeta aparecen sin reiniciar.
  try {
    const r = await fetch('./api/fotos', { cache: 'no-store' });
    if (!r.ok) return [];
    const x = await r.json();
    return Array.isArray(x) ? x : [];
  } catch (e) { return []; }
}
function photoUrlCandidates(filename) {
  const base = fotoBase(filename);
  if (!base) return [];
  const stem = fotoStem(base);
  const hasExt = /\.[^.]+$/.test(base);
  const names = hasExt ? [base, ...IMAGE_EXTS.map(ext => stem + '.' + ext)] : IMAGE_EXTS.map(ext => stem + '.' + ext);
  const dirs = ['./', './Fotos_Otras/', './fotos/', './Fotos/'];
  return [...new Set(dirs.flatMap(dir => names.map(n => dir + encodeURIComponent(n).replace(/%2F/gi, '/'))))];
}
async function collectPhotos(code) {
  const entry = PHOTO_MAP.get(String(code || '').trim().toUpperCase()) || { p: [], o: [] };
  const wanted = [...entry.p.map(n => ({ n, label: 'Foto principal' })), ...entry.o.map(n => ({ n, label: 'Otra foto' }))];
  const out = [], seen = new Set();
  const index = await getProjectPhotoIndex();

  // Primero: buscar en el índice local del proyecto, sin importar mayúsculas,
  // espacios, guiones, sufijos de copia o extensión (.jpg/.jpeg/.png/.webp/etc.).
  for (const w of wanted) {
    const base = fotoBase(w.n);
    const stem = fotoStem(base);
    const tag = cajaTag(base);
    const norm = fotoNorm(stem);
    let matches = index.filter(f => {
      const fileName = f.name || (f.path || '').split('/').pop() || '';
      const candidateTag = cajaTag(fileName);
      const candidateNorm = fotoNorm(fileName);
      if (tag) return candidateTag === tag;
      return candidateNorm === norm || candidateNorm.startsWith(norm);
    });
    matches.sort((a,b) => {
      const an = a.name || (a.path || '').split('/').pop() || '';
      const bn = b.name || (b.path || '').split('/').pop() || '';
      const exactA = fotoNorm(an) === norm ? 0 : 1;
      const exactB = fotoNorm(bn) === norm ? 0 : 1;
      return exactA - exactB || (Number(b.mtime || 0) - Number(a.mtime || 0));
    });
    const exact = matches.filter(f => {
      const fn = f.name || (f.path || '').split('/').pop() || '';
      return fotoNorm(fn) === norm;
    });
    const selected = exact.length ? exact.slice(0, 1) : matches;
    for (const f of selected) {
      const url = f.url || ('./' + String(f.path || '').split('/').map(encodeURIComponent).join('/'));
      if (url && !seen.has(url)) {
        if (await probeImage(url)) { seen.add(url); out.push({ url, label: w.label }); }
      }
    }
  }

  // Segundo: compatibilidad sin servidor Python. Busca rutas directas relativas al HTML,
  // en la raíz del proyecto y en Fotos_Otras/fotos/Fotos, probando extensiones de imagen.
  if (!out.length) {
    for (const w of wanted) {
      for (const url of photoUrlCandidates(w.n)) {
        if (seen.has(url)) continue;
        if (await probeImage(url)) {
          seen.add(url);
          out.push({ url, label: w.label });
          break;
        }
      }
    }
  }
  return out;
}

function showPhotoAt(i) {
  if (!photoList.length) return;
  photoIdx = (i + photoList.length) % photoList.length;
  const cur = photoList[photoIdx];
  resetZoom();
  photoNoImg.style.display = 'none';
  photoImg.onload = () => { photoNoImg.style.display = 'none'; photoImg.style.display = 'block'; };
  photoImg.onerror = () => { photoImg.style.display = 'none'; photoNoImg.style.display = 'flex'; };
  photoImg.src = cur.url;
  const multi = photoList.length > 1;
  photoPrev.style.display = photoNext.style.display = multi ? 'grid' : 'none';
  photoCounter.style.display = 'block';
  photoCounter.textContent = `${cur.label} · ${photoIdx + 1} de ${photoList.length}`;
}

async function openPhotoModal(code, name) {
  const reqId = ++photoRequestId;
  $('#photoTitleItem').textContent = name || 'Detalle de Artículo';
  $('#photoTitleCode').textContent = `Nro Serie / Archivo: ${code || 'Sin asignar'}`;
  resetZoom();
  revokePhotoURLs();
  photoList = []; photoIdx = 0; photoCode = code || '';
  photoImg.onload = photoImg.onerror = null;
  photoImg.style.display = 'none'; photoNoImg.style.display = 'none';
  photoPrev.style.display = photoNext.style.display = photoCounter.style.display = 'none';
  modal.classList.add('open');

  if (!code) { photoNoImg.style.display = 'flex'; return; }
  const list = await collectPhotos(code);
  if (reqId !== photoRequestId) { return; }   // se abrió otra foto o se cerró mientras buscaba
  photoList = list;
  if (!photoList.length) { photoNoImg.style.display = 'flex'; return; }
  showPhotoAt(0);
}

function closePhotoModal() {
  modal.classList.remove('open');
  photoRequestId++;
  revokePhotoURLs(); photoList = [];
}

photoPrev.addEventListener('click', e => { e.stopPropagation(); showPhotoAt(photoIdx - 1); });
photoNext.addEventListener('click', e => { e.stopPropagation(); showPhotoAt(photoIdx + 1); });
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('open') || photoList.length < 2) return;
  if (e.key === 'ArrowLeft') showPhotoAt(photoIdx - 1);
  if (e.key === 'ArrowRight') showPhotoAt(photoIdx + 1);
});

// Eventos de botones dentro de la tabla
$('#tbody').addEventListener('click', e => {
  const btn = e.target.closest('.btn-photo');
  if (!btn) return;
  openPhotoModal(btn.dataset.photoCode, btn.dataset.photoName);
});

// Controles del Modal
$('#btnClosePhoto').addEventListener('click', closePhotoModal);
$('#btnZoomIn').addEventListener('click', () => { zoomLevel = Math.min(zoomLevel + 0.35, 4.5); updateTransform(); });
$('#btnZoomOut').addEventListener('click', () => { zoomLevel = Math.max(zoomLevel - 0.35, 0.5); updateTransform(); });
$('#btnZoomReset').addEventListener('click', resetZoom);

// Arrastrar (Pan) & Zoom con la Rueda
stage.addEventListener('wheel', e => {
  if (!modal.classList.contains('open')) return;
  e.preventDefault();
  zoomLevel += e.deltaY < 0 ? 0.25 : -0.25;
  zoomLevel = Math.min(Math.max(0.5, zoomLevel), 4.5);
  updateTransform();
}, { passive: false });

stage.addEventListener('mousedown', e => {
  if (e.target === photoImg) {
    isDragging = true;
    startX = e.clientX - translateX;
    startY = e.clientY - translateY;
  }
});
window.addEventListener('mousemove', e => {
  if (isDragging) {
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    updateTransform();
  }
});
window.addEventListener('mouseup', () => { isDragging = false; });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('open')) {
    closePhotoModal();
  }
});

/* ================================================================
   Filtros activos + botón "Borrar filtros"
   ================================================================ */
const setTxt = (set, f = x => x) => { const a = [...set].map(f); return a.length > 2 ? `${a.slice(0, 2).join(', ')} +${a.length - 2}` : a.join(', '); };
function renderStatus(n) {
  const tags = [];
  if (state.from || state.to) tags.push({ k: 'fecha', t: `Fecha: ${state.from ? fmtDate(state.from) : '…'} – ${state.to ? fmtDate(state.to) : '…'}` });
  if (state.not.size)  tags.push({ k: 'not',  t: `Nro Serie Softland: ${setTxt(state.not)}` });
  if (state.cust.size) tags.push({ k: 'cust', t: `Custodio: ${setTxt(state.cust, i => titleCase(CUSTS[i]))}` });
  if (state.q.trim())  tags.push({ k: 'q',    t: `Búsqueda: “${state.q.trim()}”` });
  $('#status').innerHTML = tags.length
    ? `<span>Mostrando <b>${nf.format(n)}</b> de ${nf.format(ROWS.length)} movimientos</span>` +
      tags.map(t => `<span class="tag"><span>${esc(t.t)}</span><button type="button" data-k="${t.k}" aria-label="Quitar filtro">${ICON_X}</button></span>`).join('')
    : `<span>Sin filtros: viendo los <b>${nf.format(ROWS.length)}</b> movimientos</span>`;
  const btn = $('#clearBtn');
  btn.disabled = !tags.length; btn.classList.toggle('has', tags.length > 0);
  $('#clearBadge').textContent = tags.length;
}
$('#status').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'fecha') state.from = state.to = '';
  else if (k === 'q') { state.q = ''; $('#q').value = ''; }
  else state[k].clear();
  update();
});
function clearAll() {
  state.from = state.to = ''; state.q = ''; $('#q').value = '';
  state.not.clear(); state.cust.clear();
  closeAll(); update();
}
$('#clearBtn').addEventListener('click', clearAll);

/* ================================================================
   Render general
   ================================================================ */
function update() {
  const rows = filtered();
  renderTable(rows); renderStatus(rows.length);
  dropdowns.forEach(d => d.refresh());
}
$('#ver').textContent = window.__TRAZABILIDAD_ERROR__ ? 'Sin conexión con Google Sheets' : `Google Sheets · ${ROWS.length} movimientos`;
update();

/* ================================================================
   Navegación con transición circular
   ================================================================ */
const curtain = $('#curtain');
requestAnimationFrame(() => requestAnimationFrame(() => curtain.classList.remove('on')));
window.addEventListener('pageshow', () => curtain.classList.remove('on'));
document.querySelectorAll('.btn[data-color], .pager a').forEach(a => {
  a.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    if (a.getAttribute('aria-current') === 'page') { e.preventDefault(); return; }
    e.preventDefault();
    const r = a.getBoundingClientRect();
    const colors = { 'Index.html': '#4DA6FF', 'Resumen.html': '#4DA6FF', 'Por_Ubicacion.html': '#4DB6AC', 'Calidad.html': '#FF8A5C' };
    curtain.style.setProperty('--cx', (e.clientX || r.left + r.width / 2) + 'px');
    curtain.style.setProperty('--cy', (e.clientY || r.top + r.height / 2) + 'px');
    curtain.style.setProperty('--curtain', a.dataset.color || colors[a.getAttribute('href')] || '#C77DFF');
    curtain.classList.add('on');
    setTimeout(() => { location.href = a.href; }, 520);
  });
});

})();
</script>

<script>
window.SLOTS_XMAS_SWITCH = false;
/* ============================================================
   TEMA NAVIDEÑO · Grupo SLOTS · Sistema de Información
   ------------------------------------------------------------
   Un solo archivo para TODAS las hojas. Para activarlo en una
   hoja, agregar antes de </body>:
       <script src="navidad.js"><\/script>
   El botón es casi invisible y está en el borde izquierdo,
   a media altura. Un clic activa/desactiva el tema y la
   elección se recuerda en todas las hojas (mismo navegador).
   ============================================================ */
(function () {
  'use strict';
  if (window.__slotsXmas) return;
  window.__slotsXmas = true;

  var KEY = 'slots_tema_navidad';
  var root = document.documentElement;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* El interruptor visible solo se crea si la hoja no pide lo contrario
     (en las hojas que solo "siguen" al index: window.SLOTS_XMAS_SWITCH = false antes de este script). */
  var withSwitch = window.SLOTS_XMAS_SWITCH !== false;

  /* Estado compartido entre hojas: localStorage y, como respaldo, window.name (misma pestaña). */
  function lsGet() {
    try { var v = localStorage.getItem(KEY); if (v !== null) return v === '1'; } catch (e) {}
    var m = /slots-xmas=([01])/.exec(window.name || '');
    return !!m && m[1] === '1';
  }
  var chan = null;
  try { chan = new BroadcastChannel('slots_xmas'); } catch (e) {}
  function lsSet(v) {
    try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) {}
    window.name = (window.name || '').replace(/;?slots-xmas=[01]/g, '') + ';slots-xmas=' + (v ? 1 : 0);
  }

  /* ---------------- Cursor pino ---------------- */
  var TREE_SVG = "<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>" +
    "<polygon points='16,0.5 17.7,4.2 21.7,4.7 18.8,7.4 19.6,11.4 16,9.4 12.4,11.4 13.2,7.4 10.3,4.7 14.3,4.2' fill='#FFD54A'/>" +
    "<path d='M16 5 L9 14 H12.5 L6 21 H11 L3.5 29 H28.5 L21 21 H26 L19.5 14 H23 Z' fill='#1E8F4E' stroke='#0B5D2E' stroke-width='1.2' stroke-linejoin='round'/>" +
    "<rect x='14' y='28.5' width='4' height='3.2' fill='#6D4C41'/>" +
    "<circle cx='15' cy='13' r='1.3' fill='#F25555'/><circle cx='11' cy='20' r='1.3' fill='#FFD54A'/>" +
    "<circle cx='20.5' cy='20.5' r='1.3' fill='#F25555'/><circle cx='15' cy='25.5' r='1.3' fill='#FFFFFF'/>" +
    "<circle cx='7.5' cy='27' r='1.2' fill='#FFD54A'/><circle cx='24.5' cy='27' r='1.2' fill='#F25555'/></svg>";
  var TREE_CURSOR = 'url("data:image/svg+xml,' + encodeURIComponent(TREE_SVG) + '") 16 1,auto';

  /* ---------------- CSS ---------------- */
  var css = [
    /* Botón oculto */
    '#xm-toggle{position:fixed;left:14px;bottom:14px;width:36px;height:20px;padding:0;margin:0;',
    'border:1px solid rgba(255,255,255,.35);border-radius:20px;background:rgba(255,255,255,.05);',
    'opacity:.2;cursor:pointer;z-index:99999;transition:opacity .25s,border-color .25s;}',
    '#xm-toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;',
    'background:rgba(255,255,255,.85);transition:transform .25s,background .25s}',
    '#xm-toggle:hover,#xm-toggle:focus-visible{opacity:.85;outline:none}',
    'html.xm-on #xm-toggle{border-color:rgba(127,227,161,.7)}',
    'html.xm-on #xm-toggle::after{transform:translateX(16px);background:#7FE3A1}',

    /* Paleta */
    'html.xm-on{--bg-0:#04160F;--bg-1:#082A1B;--brand:#146B3A;--ink-soft:#B7CDBF;--line:rgba(255,255,255,.11);',
    '--c-resumen:#5BD68A;--c-ubicacion:#E8C766;--c-trazabilidad:#F07070;--c-calidad:#9BE0B5;',
    '--accent:#5BD68A;--c-ent:#5BD68A;--c-sal:#F07070;--c-mov:#E8C766;--c-net:#A8E6BE;--c-warn:#E8C766;',
    '--xm-green:#1E8F4E;--xm-red:#C62828;--xm-gold:#E8C766}',
    'html.xm-on body{background:#04160F;background-color:#04160F;padding-top:16px}',
    'html.xm-on .aurora{background:radial-gradient(60vw 50vh at 15% 10%,rgba(20,107,58,.75),transparent 70%),',
    'radial-gradient(50vw 50vh at 90% 20%,rgba(198,40,40,.22),transparent 70%),',
    'radial-gradient(55vw 60vh at 70% 100%,rgba(232,199,102,.14),transparent 70%),linear-gradient(180deg,#082A1B,#04160F)}',
    'html.xm-on h1{background:linear-gradient(180deg,#fff 30%,#A8E6BE 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}',
    'html.xm-on h1::after{background:linear-gradient(90deg,#5BD68A,#F07070,#E8C766)!important}',

    /* Logo: nunca se recolorea. Siempre crece apenas al pasar el mouse (con o sin Navidad) */
    '.logo{transition:scale .35s cubic-bezier(.2,.8,.2,1)}',
    '.logo:hover{scale:1.06}',
    'html.xm-on .dd-panel,html.xm-on .tip{background:#0B2A1C!important;border-color:rgba(120,230,160,.25)!important}',
    'html.xm-on .login-submit{background:linear-gradient(100deg,#0B5D2E,#1E8F4E);border-color:rgba(120,230,160,.5)}',
    'html.xm-on .login-panel::before{background:linear-gradient(90deg,transparent,#5BD68A,#F07070,transparent)}',

    /* Gorrito */
    /* Cursor: pino de Navidad (los campos de texto conservan el cursor de escritura) */
    'html.xm-on,html.xm-on *{cursor:' + TREE_CURSOR + '!important}',
    'html.xm-on input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),html.xm-on textarea{cursor:text!important}',

    /* Fuegos artificiales */
    '#xm-fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9990}',

    /* Tarjetas / KPI / filtros */
    'html.xm-on .card::after{height:6px;background:repeating-linear-gradient(45deg,#C62828 0 9px,#fff 9px 18px)}',
    'html.xm-on .card{border-color:rgba(120,230,160,.18)}',
    'html.xm-on .kpis li:nth-child(odd){border-color:rgba(240,112,112,.55)}',
    'html.xm-on .kpis li:nth-child(even){border-color:rgba(91,214,138,.55)}',
    'html.xm-on select,html.xm-on input[type=text],html.xm-on input[type=search],html.xm-on input[type=date]{',
    'border-color:rgba(91,214,138,.55)!important;box-shadow:0 0 0 1px rgba(198,40,40,.25)}',
    'html.xm-on select:focus,html.xm-on input:focus{border-color:#E8C766!important}',
    '.xm-deco{position:absolute;top:-7px;right:12px;width:50px;height:36px;pointer-events:none;z-index:4;display:none;',
    'filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}',
    'html.xm-on .xm-deco{display:block}',
    '.xm-deco-host{position:relative}',

    /* Luces */
    '#xm-lights{position:fixed;left:0;top:0;width:100%;height:40px;pointer-events:none;z-index:9985;display:none}',
    'html.xm-on #xm-lights{display:block}',
    '#xm-lights .b{animation:xmBlink 2.4s ease-in-out infinite}',
    '@keyframes xmBlink{0%,100%{opacity:1}50%{opacity:.35}}',

    /* Nieve */
    '#xm-snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9980;display:none}',
    'html.xm-on #xm-snow{display:block}',

    '@media (prefers-reduced-motion:reduce){#xm-lights .b{animation:none}}',
    '@media print{#xm-snow,#xm-lights,#xm-toggle,#xm-fw,.xm-deco{display:none!important}}'
  ].join('\n');

  var st = document.createElement('style');
  st.id = 'xm-style';
  st.textContent = css;
  document.head.appendChild(st);

  /* ---------------- Botón oculto ---------------- */
  var btn = document.createElement('button');
  btn.id = 'xm-toggle';
  btn.type = 'button';
  btn.setAttribute('aria-label', 'Cambiar tema');
  btn.setAttribute('role', 'switch');
  btn.setAttribute('aria-checked', 'false');
  if (withSwitch) document.body.appendChild(btn);

  /* ---------------- Luces ---------------- */
  var lights = document.createElement('div');
  lights.id = 'xm-lights';
  lights.setAttribute('aria-hidden', 'true');
  document.body.appendChild(lights);

  function buildLights() {
    var w = window.innerWidth, step = w < 600 ? 34 : 46, n = Math.ceil(w / step) + 1;
    var cols = ['#35D07F', '#E8C766', '#F25555', '#35D07F', '#7FE3A1', '#F25555'];
    var d = 'M0,6';
    for (var i = 0; i < n; i++) {
      var x0 = i * step, x1 = x0 + step;
      d += ' Q' + (x0 + step / 2) + ',20 ' + x1 + ',6';
    }
    var s = '<svg width="' + w + '" height="40" xmlns="http://www.w3.org/2000/svg">';
    s += '<path d="' + d + '" fill="none" stroke="#0E3B22" stroke-width="2"/>';
    for (i = 0; i < n; i++) {
      var cx = i * step + step / 2, cy = 14.5, c = cols[i % cols.length];
      s += '<g class="b" style="animation-delay:' + ((i % 6) * 0.4).toFixed(1) + 's">' +
           '<rect x="' + (cx - 2.5) + '" y="' + (cy - 7) + '" width="5" height="5" rx="1" fill="#0E3B22"/>' +
           '<ellipse cx="' + cx + '" cy="' + (cy + 1) + '" rx="4" ry="5.5" fill="' + c + '"/>' +
           '<ellipse cx="' + cx + '" cy="' + (cy + 1) + '" rx="9" ry="10" fill="' + c + '" opacity=".16"/></g>';
    }
    lights.innerHTML = s + '</svg>';
  }

  /* ---------------- Nieve sutil ---------------- */
  var cv = document.createElement('canvas');
  cv.id = 'xm-snow';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  var ctx = cv.getContext('2d'), flakes = [], raf = 0, W = 0, H = 0;

  function sizeSnow() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.round(Math.min(70, Math.max(22, W * H / 22000)));
    flakes = [];
    for (var i = 0; i < count; i++) flakes.push(newFlake(true));
  }
  function newFlake(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -8,
      r: .8 + Math.random() * 1.9,
      v: .25 + Math.random() * .6,
      a: .25 + Math.random() * .4,
      p: Math.random() * 6.28,
      s: .004 + Math.random() * .012
    };
  }
  function snowFrame() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.v; f.p += f.s;
      f.x += Math.sin(f.p) * .35;
      if (f.y > H + 6) { flakes[i] = newFlake(false); continue; }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.283);
      ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
      ctx.fill();
    }
    raf = requestAnimationFrame(snowFrame);
  }
  function startSnow() {
    if (reduce || raf) return;
    sizeSnow(); snowFrame();
  }
  function stopSnow() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0; ctx.clearRect(0, 0, W, H);
  }
  document.addEventListener('visibilitychange', function () {
    if (!root.classList.contains('xm-on')) return;
    if (document.hidden) stopSnow(); else startSnow();
  });

  /* ---------------- Fuegos artificiales (solo con Navidad activa, al pasar por el logo) ---------------- */
  var fwCv = document.createElement('canvas');
  fwCv.id = 'xm-fw';
  fwCv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fwCv);
  var fx = fwCv.getContext('2d'), parts = [], fwRaf = 0, fwTimer = 0, fwHost = null, fW = 0, fH = 0;
  var FW_COLS = ['255,214,102', '255,255,255', '91,214,138', '240,90,90', '255,160,80', '120,200,255'];

  function fwSize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fW = window.innerWidth; fH = window.innerHeight;
    fwCv.width = fW * dpr; fwCv.height = fH * dpr;
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y) {
    var n = 30 + Math.floor(Math.random() * 16);
    var c1 = FW_COLS[Math.floor(Math.random() * FW_COLS.length)];
    var c2 = FW_COLS[Math.floor(Math.random() * FW_COLS.length)];
    var base = Math.random() * 6.28;
    for (var i = 0; i < n; i++) {
      var ang = base + i / n * 6.283, sp = 1 + Math.random() * 2.6;
      parts.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        a: 1, d: .011 + Math.random() * .011,
        c: i % 3 === 0 ? c2 : c1, r: 1 + Math.random() * 1.3
      });
    }
  }
  function fwFrame() {
    fx.clearRect(0, 0, fW, fH);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.px = p.x; p.py = p.y;
      p.vx *= .985; p.vy = p.vy * .985 + .035;
      p.x += p.vx; p.y += p.vy; p.a -= p.d;
      if (p.a <= 0) { parts.splice(i, 1); continue; }
      fx.strokeStyle = 'rgba(' + p.c + ',' + (p.a * .9).toFixed(2) + ')';
      fx.lineWidth = p.r;
      fx.lineCap = 'round';
      fx.beginPath(); fx.moveTo(p.px, p.py); fx.lineTo(p.x, p.y); fx.stroke();
    }
    if (parts.length || fwHost) fwRaf = requestAnimationFrame(fwFrame);
    else { fwRaf = 0; fx.clearRect(0, 0, fW, fH); }
  }
  function shoot() {
    if (!fwHost) return;
    var r = fwHost.getBoundingClientRect();
    burst(r.left - r.width * .05 + Math.random() * r.width * 1.1,
          r.top - r.height * .55 + Math.random() * r.height * .95);
  }
  function fwStart(host) {
    if (reduce || !root.classList.contains('xm-on') || fwHost === host) return;
    fwSize();
    fwHost = host;
    shoot();
    clearInterval(fwTimer);
    fwTimer = setInterval(shoot, 420);
    if (!fwRaf) fwRaf = requestAnimationFrame(fwFrame);
  }
  function fwStop() {
    fwHost = null;
    clearInterval(fwTimer); fwTimer = 0;
  }
  function bindLogoHover(host) {
    if (host.__xmFw) return;
    host.__xmFw = true;
    host.addEventListener('mouseenter', function () { fwStart(host); });
    host.addEventListener('mouseleave', fwStop);
  }

  /* ---------------- Decoraciones ---------------- */
  var DECO = '<svg class="xm-deco" viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<path d="M30 26 C22 10 8 8 2 14 C8 26 20 30 30 26 Z" fill="#1E8F4E"/>' +
    '<path d="M30 26 C38 10 52 8 58 14 C52 26 40 30 30 26 Z" fill="#157A3F"/>' +
    '<path d="M30 28 C24 36 14 40 8 38 C12 28 22 24 30 28 Z" fill="#26A65B"/>' +
    '<path d="M30 28 C36 36 46 40 52 38 C48 28 38 24 30 28 Z" fill="#1E8F4E"/>' +
    '<circle cx="27" cy="27" r="5" fill="#E53935"/><circle cx="35" cy="26" r="5" fill="#C62828"/>' +
    '<circle cx="31" cy="33" r="5" fill="#EF5350"/>' +
    '<circle cx="25.5" cy="25" r="1.3" fill="#fff" opacity=".7"/><circle cx="33.5" cy="24" r="1.3" fill="#fff" opacity=".7"/></svg>';

  var LOGO_SEL = '.logo,.login-logo,[aria-label*="SLOTS" i],img[alt*="SLOTS" i],img[src*="logo" i]';
  var DECO_SEL = '.card,.kpi,.kpi-card,.kpi-box,.tile,.slicer,.filter,.filters,.filtros,.filtro,.dd,' +
                 '[class*="kpi" i],[class*="slicer" i],[class*="filtro" i],[class*="filter" i]';

  function decorate() {
    /* Logo: solo fuegos artificiales al pasar el mouse (el logo no se modifica) */
    document.querySelectorAll(LOGO_SEL).forEach(function (el) {
      var host = el.tagName === 'IMG' ? el.parentElement : el;
      if (host) bindLogoHover(host);
    });
    /* Acebo en KPIs, tarjetas y filtros */
    document.querySelectorAll(DECO_SEL).forEach(function (el) {
      if (el.tagName === 'UL' || el.tagName === 'LI' || el.tagName === 'SELECT' || el.tagName === 'INPUT' ||
          el.tagName === 'OPTION' || el.tagName === 'SVG' || el.closest('.xm-deco') || el.id === 'xm-toggle') return;
      if (el.classList.contains('kpis')) return;
      /* Un contenedor que agrupa otros elementos decorables (ej. la fila de filtros) no se decora: lo hacen sus hijos */
      if (!el.matches('.card,.kpi') && el.querySelector(DECO_SEL)) return;
      if (el.querySelector(':scope > .xm-deco')) return;
      if (el.parentElement && el.parentElement.closest('.xm-deco-host')) return;
      var r = el.getBoundingClientRect();
      if (r.width < 90 || r.height < 44) return;
      if (getComputedStyle(el).position === 'static') el.classList.add('xm-deco-host');
      el.classList.add('xm-deco-host');
      el.insertAdjacentHTML('beforeend', DECO);
      var dc = el.lastElementChild;
      if (dc && dc.classList.contains('xm-deco')) {
        /* Filtros / elementos bajos: acebo más chico y corrido para no tapar la flechita */
        if (r.height < 80) { dc.style.width = '36px'; dc.style.height = '26px'; dc.style.right = '46px'; dc.style.top = '-10px'; }
        /* Si el contenedor recorta lo que sobresale (overflow:hidden), el acebo va por dentro */
        if (getComputedStyle(el).overflow !== 'visible') {
          dc.style.top = '3px';
          if (r.height >= 80) dc.style.right = '14px';
        }
      }
    });
  }

  /* Hojas con contenido que se genera después (tableros dinámicos) */
  var mo = null, tm = 0;
  function watch() {
    if (mo || !window.MutationObserver) return;
    mo = new MutationObserver(function (list) {
      for (var i = 0; i < list.length; i++) {
        var t = list[i].target;
        if (t && t.closest && t.closest('.xm-deco,#xm-lights,#xm-snow,#xm-fw')) continue;
        clearTimeout(tm); tm = setTimeout(decorate, 250); break;
      }
    });
    mo.observe(document.body, { childList: true, subtree: true });
  }
  function unwatch() { if (mo) { mo.disconnect(); mo = null; } }

  /* ---------------- Activar / desactivar ---------------- */
  function apply(on) {
    root.classList.toggle('xm-on', on);
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    if (on) {
      buildLights();
      decorate();
      watch();
      startSnow();
    } else {
      unwatch();
      stopSnow();
      fwStop(); parts.length = 0;
    }
  }

  btn.addEventListener('click', function () {
    var on = !root.classList.contains('xm-on');
    lsSet(on);
    apply(on);
    if (chan) { try { chan.postMessage({ k: KEY, on: on }); } catch (e) {} }
  });

  var rz = 0;
  window.addEventListener('resize', function () {
    if (!root.classList.contains('xm-on')) return;
    clearTimeout(rz);
    rz = setTimeout(function () { buildLights(); if (raf) sizeSnow(); }, 150);
  });

  /* Sincronización en vivo: lo que se activa/desactiva en el Index se aplica
     en todas las hojas abiertas (storage + BroadcastChannel + chequeo periódico). */
  function isOn() { return root.classList.contains('xm-on'); }
  function follow(on) { if (on !== isOn()) apply(on); }

  /* Solo se reacciona cuando el valor guardado CAMBIA (así un chequeo periódico
     nunca pisa lo que llegó por otro canal). */
  var last = lsGet();
  function check() {
    var v = lsGet();
    if (v !== last) { last = v; follow(v); }
  }
  window.addEventListener('storage', function (e) {
    if (e.key === KEY || e.key === null) check();
  });
  if (chan) chan.onmessage = function (e) {
    var d = e.data;
    if (!d || d.k !== KEY) return;
    if (d.ask) {                       /* una hoja recién abierta pregunta el estado: responde el Index */
      if (withSwitch) { try { chan.postMessage({ k: KEY, on: isOn() }); } catch (x) {} }
      return;
    }
    follow(!!d.on);
  };
  window.addEventListener('pageshow', function () { check(); });
  window.addEventListener('focus', check);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(function () { if (!document.hidden) check(); }, 1000);

  apply(lsGet());
  if (chan && !withSwitch) { try { chan.postMessage({ k: KEY, ask: true }); } catch (e) {} }
})();

</script>
</body>
